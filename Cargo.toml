[workspace]
resolver = "2"
members = [
  "apps/api",
  "apps/api/migration",
  "apps/collector",
  "crates/domain-core",
  "crates/event-envelope",
]
default-members = ["apps/api", "apps/collector", "crates/domain-core", "crates/event-envelope"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.94"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
loco-rs = { version = "=1.3.1", default-features = false, features = ["auth", "cli", "with-db", "db-postgres", "worker", "multi-tenancy", "compression"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
